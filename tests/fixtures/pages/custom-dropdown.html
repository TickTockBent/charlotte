<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Dropdown Test Page</title>
</head>
<body>
  <h1>Custom Dropdown Test</h1>

  <!-- A non-native dropdown widget (ARIA listbox), not a real <select>. -->
  <div id="custom-dd" role="listbox" tabindex="0" aria-label="Custom Dropdown">
    <div role="option" id="custom-dd-option-1">Option 1</div>
    <div role="option" id="custom-dd-option-2">Option 2</div>
  </div>
</body>
</html>
